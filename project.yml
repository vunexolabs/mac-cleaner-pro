# XcodeGen project spec — source of truth for the .xcodeproj.
# Regenerate with:  xcodegen generate
#
# Once you have an Apple Developer Team ID, set it in DEVELOPMENT_TEAM below
# and switch CODE_SIGN_IDENTITY to "Developer ID Application" for release builds.

name: MacCleanerPro

options:
  bundleIdPrefix: com.maccleanerpro
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    # Ad-hoc signing for dev. Replace with "Developer ID Application: <Your Name> (TEAMID)" for release.
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    OTHER_SWIFT_FLAGS: "-warnings-as-errors -no-warnings-as-errors"  # placeholder
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      ONLY_ACTIVE_ARCH: NO

targets:

  # ---------------------------------------------------------------------------
  # Core framework — pure Swift, no UI. Linked into the app and tests.
  # ---------------------------------------------------------------------------
  Core:
    type: framework
    platform: macOS
    sources:
      - path: Core
      - path: Shared
    dependencies:
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maccleanerpro.Core
        DEFINES_MODULE: YES
        SKIP_INSTALL: NO
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        LD_RUNPATH_SEARCH_PATHS: ["@executable_path/../Frameworks", "@loader_path/Frameworks"]
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "6"
        MARKETING_VERSION: "1.0.7"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 MacCleanerPro. All rights reserved."

  # ---------------------------------------------------------------------------
  # Main app — SwiftUI, Developer ID signed, Hardened Runtime, NOT sandboxed.
  # ---------------------------------------------------------------------------
  MacCleanerPro:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: RulePacks/v1.json
        buildPhase: resources
    dependencies:
      - target: Core
      - target: PrivilegedHelper
        embed: true
        codeSign: true
        copyFiles:
          destination: executables
          subpath: ""
    info:
      path: App/Info.plist
      properties:
        CFBundleName: "Mac Cleaner Pro"
        CFBundleDisplayName: "Mac Cleaner Pro"
        CFBundleShortVersionString: "1.0.7"
        CFBundleVersion: "6"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 MacCleanerPro. All rights reserved."
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: App/MacCleanerPro.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - "/Library/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maccleanerpro
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/MacCleanerPro.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Extract localizable strings into App/Localizable.xcstrings on build.
        # Xcode picks up Text("…") and other literals automatically; strings
        # built in Swift need String(localized:) — see CONTRIBUTING.md.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        # Embed helper as a daemon, registered via SMAppService at runtime.
        INSTALL_PATH: "$(LOCAL_APPS_DIR)"
    postBuildScripts:
      - name: "Relocate helper to Contents/MacOS"
        # xcodegen's embed:true puts tool dependencies in Contents/Resources/.
        # SMAppService daemons must live at Contents/MacOS/<bundle-id> so that
        # Launchd.plist BundleProgram resolves and code signing treats it as a
        # mach-o executable rather than a resource.
        script: |
          set -euo pipefail
          src="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Resources/com.maccleanerpro.helper"
          dst_dir="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/MacOS"
          if [ -f "$src" ]; then
            mkdir -p "$dst_dir"
            mv "$src" "$dst_dir/com.maccleanerpro.helper"
          fi
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Resources/com.maccleanerpro.helper"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/MacOS/com.maccleanerpro.helper"
      - name: "Embed launchd plist for SMAppService daemon"
        # SMAppService.daemon(plistName:) looks up plist files in
        # Contents/Library/LaunchDaemons/ inside the app bundle. The plist is also
        # __launchd_plist-sectcreated into the helper binary (for inspection &
        # legacy SMJobBless paths), but SMAppService needs the file form here.
        script: |
          set -euo pipefail
          dest="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Library/LaunchDaemons"
          mkdir -p "$dest"
          cp "${SRCROOT}/PrivilegedHelper/Launchd.plist" "$dest/com.maccleanerpro.helper.plist"
        inputFiles:
          - "$(SRCROOT)/PrivilegedHelper/Launchd.plist"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Library/LaunchDaemons/com.maccleanerpro.helper.plist"
        basedOnDependencyAnalysis: true

  # ---------------------------------------------------------------------------
  # Privileged helper — runs as root via SMAppService.daemon, XPC-only.
  # Embedded into the app bundle at Contents/MacOS/<helper-id>.
  # ---------------------------------------------------------------------------
  PrivilegedHelper:
    type: tool
    platform: macOS
    sources:
      - path: PrivilegedHelper
      - path: Shared
    info:
      path: PrivilegedHelper/Info.plist
      properties:
        CFBundleIdentifier: com.maccleanerpro.helper
        CFBundleName: com.maccleanerpro.helper
        CFBundleVersion: "6"
        CFBundleShortVersionString: "1.0.7"
        # SMAuthorizedClients: only the main app's signing identity may connect.
        SMAuthorizedClients:
          - "anchor apple generic and identifier com.maccleanerpro and certificate leaf[subject.OU] = \"REPLACE_TEAM_ID\""
    entitlements:
      path: PrivilegedHelper/Helper.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_NAME: com.maccleanerpro.helper
        PRODUCT_BUNDLE_IDENTIFIER: com.maccleanerpro.helper
        INFOPLIST_FILE: PrivilegedHelper/Info.plist
        CODE_SIGN_ENTITLEMENTS: PrivilegedHelper/Helper.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS:
          - "-sectcreate"
          - "__TEXT"
          - "__info_plist"
          - "$(SRCROOT)/PrivilegedHelper/Info.plist"
          - "-sectcreate"
          - "__TEXT"
          - "__launchd_plist"
          - "$(SRCROOT)/PrivilegedHelper/Launchd.plist"
        SKIP_INSTALL: YES
        INSTALL_PATH: "/Contents/MacOS"

  # ---------------------------------------------------------------------------
  # Unit tests for Core.
  # ---------------------------------------------------------------------------
  CoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CoreTests
    dependencies:
      - target: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maccleanerpro.CoreTests
        BUNDLE_LOADER: ""
        TEST_HOST: ""
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MacCleanerPro:
    build:
      targets:
        MacCleanerPro: all
        PrivilegedHelper: all
        Core: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CoreTests
    archive:
      config: Release
  Core:
    build:
      targets:
        Core: all
    test:
      config: Debug
      targets:
        - CoreTests
